name: Cold Wallet Balances
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run balance report
        run: python cold_wallet_report.py addresses.csv
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit balance history
        run: |
          git config user.name "cold-wallet-bot"
          git config user.email "actions@github.com"
          git add balance_history.json
          git diff --staged --quiet || git commit -m "Update balance snapshot $(date -u +%F)"
          git push
